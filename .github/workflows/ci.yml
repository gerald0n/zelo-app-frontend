name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit (dependências de produção, severidade alta+)
        run: pnpm audit --prod --audit-level high

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          APP_ENV: preview
          NEXT_PUBLIC_APP_ENV: preview
          # Chaves reais não são necessárias: as páginas são dinâmicas e o
          # schema de env trata tudo como opcional. Valores só para o build
          # não reclamar de ausência em nenhum caminho.
          NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  migrate:
    name: Aplica migrations pendentes em produção
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Requer os secrets do repo (Settings > Secrets and variables > Actions):
      #   SUPABASE_ACCESS_TOKEN — https://supabase.com/dashboard/account/tokens
      #   SUPABASE_DB_PASSWORD  — senha do Postgres do projeto (Settings > Database)
      #   SUPABASE_PROJECT_ID   — dhfksxagcvwaglrgcsmn (ref do projeto de produção)
      - name: Link do projeto de produção
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      # --include-all: migrations de branches paralelas nascem com timestamp
      # da criação do arquivo, não do merge — é comum uma migration "mais
      # antiga" (de uma feature que demorou mais pra ser mergeada) chegar em
      # main depois de uma "mais nova" já aplicada. Sem a flag, `db push`
      # recusa aplicar qualquer arquivo fora de ordem, mesmo quando (como
      # aqui) o conteúdo não depende do que já rodou.
      - name: Aplica migrations pendentes no banco de produção
        run: supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
